name: Build Spider Net Android APK

on:
  push:
    branches: [main, repair/core-accounting-functions-2026-10]
    paths:
      - 'SPIDER_NET_ANDROID_APP/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'SPIDER_NET_ANDROID_APP/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify checked-in Android integration
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          kotlin = Path('app/src/main/java/com/spidernet/accounting/MainActivity.kt').read_text(encoding='utf-8')
          checks = {
              'Native JavaScript dialog support': 'webView.webChromeClient = WebChromeClient()' in kotlin,
              'Android backup bridge': 'webView.addJavascriptInterface(BackupBridge(), "AndroidBackup")' in kotlin,
              'Native backup document creation': 'ActivityResultContracts.CreateDocument' in kotlin,
              'Native restore document picker': 'ActivityResultContracts.OpenDocument' in kotlin,
              'Checked-in backup implementation': 'window.onNativeBackupLoaded=function' in html and 'function applyBackupText(' in html,
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(('PASS: ' if ok else 'FAIL: ') + name)
          if failed:
              raise SystemExit('Android integration verification failed')
          PY
        working-directory: SPIDER_NET_ANDROID_APP

      - name: Check embedded JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          source = Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', source, re.S)
          if not scripts:
              raise SystemExit('No inline JavaScript block found')
          Path('/tmp/spider-net-app.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/spider-net-app.js
        working-directory: SPIDER_NET_ANDROID_APP

      - name: Install Playwright browser for UI regression tests
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
        working-directory: SPIDER_NET_ANDROID_APP

      - name: Run UI regression tests
        run: node tools/ui_regression_test.mjs
        working-directory: SPIDER_NET_ANDROID_APP

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
        working-directory: SPIDER_NET_ANDROID_APP

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: spider-net-accounting-debug-apk
          path: SPIDER_NET_ANDROID_APP/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
