*{box-sizing:border-box}

/* SPIDER NET 2.1 — visual system inspired by React Bits motion discipline and IT Tools clarity.
   Vanilla CSS only: no React runtime, remote assets, or heavy animation dependency. */
html[data-theme="dark"]{
  --bg:#071321;--panel:#0d1e30;--panel2:#11283e;--line:#23415a;
  --text:#eef7ff;--muted:#9db2c7;--accent:#9af542;--accent2:#22d3db;
  --danger:#ff788f;--warn:#ffd166;--shadow:0 12px 30px rgba(0,0,0,.22);
  --soft-blue:#142f49;--soft-green:#12382e;--soft-red:#412333;--soft-purple:#292643;color-scheme:dark
}
html[data-theme="light"]{
  --bg:#eef4f8;--panel:#ffffff;--panel2:#f4f8fb;--line:#d7e3eb;
  --text:#173149;--muted:#60798c;--accent:#16865f;--accent2:#078da5;
  --danger:#c9435d;--warn:#986b16;--shadow:0 9px 24px rgba(17,48,71,.075);
  --soft-blue:#e3f3f7;--soft-green:#e1f6eb;--soft-red:#ffedf0;--soft-purple:#efeaff;color-scheme:light
}
body{
  background-color:var(--bg);
  background-image:radial-gradient(ellipse at 88% 0%,rgba(34,211,219,.075),transparent 34%),radial-gradient(ellipse at 10% 30%,rgba(154,245,66,.045),transparent 28%);
  color:var(--text)
}
.topbar{
  background:linear-gradient(115deg,var(--panel),color-mix(in srgb,var(--panel) 91%,var(--accent2)));
  border-bottom:1px solid color-mix(in srgb,var(--accent2) 22%,var(--line));
  box-shadow:0 8px 24px rgba(0,0,0,.07)
}
.brand-emblem{background:linear-gradient(135deg,#092038,#123c55);border:1px solid #1c5b70;box-shadow:inset 0 0 15px #22d3db12,0 0 16px #22d3db0c}
.brand-emblem svg{stroke:var(--accent2)}
.sidebar{background:linear-gradient(180deg,#081a2b 0%,#0a2137 58%,#091827 100%);border-color:#193c53}
.sidebar .nav.active{background:linear-gradient(100deg,#103b49,#134153);border-color:#297a7e;box-shadow:inset -3px 0 var(--accent),0 4px 14px #0002}
.dashboard-head{position:relative}
.dashboard-head h2{letter-spacing:-.35px}
.dashboard-welcome{color:var(--text)}
.dashboard-quick .primary,button.primary{
  background:linear-gradient(115deg,var(--accent),color-mix(in srgb,var(--accent) 64%,var(--accent2)));
  border:1px solid color-mix(in srgb,var(--accent) 70%,white);
  color:#071720;font-weight:800;box-shadow:0 5px 16px color-mix(in srgb,var(--accent) 18%,transparent)
}
.dash-metric,.metric,.panel,.pos-card,.profile-hero,.lower-card,.detail-stat{
  border:1px solid var(--line);
  background:linear-gradient(145deg,var(--panel),color-mix(in srgb,var(--panel) 93%,var(--accent2)));
  box-shadow:var(--shadow)
}
.dash-metric{overflow:hidden;transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease}
.dash-metric:before{display:block;content:"";position:absolute;right:0;top:15px;bottom:15px;width:3px;border-radius:4px;background:linear-gradient(180deg,var(--accent),var(--accent2))}
.dash-metric .label,.dash-metric .hint{color:var(--muted)}
.dash-metric .value{color:var(--text)}
.metric-icon{background:color-mix(in srgb,var(--accent2) 12%,var(--panel2));color:var(--accent2);border:1px solid color-mix(in srgb,var(--accent2) 25%,var(--line))}
.tone-green .metric-icon{color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--panel2))}
.tone-red .metric-icon{color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,var(--panel2))}
.tone-blue .metric-icon{color:var(--accent2);background:color-mix(in srgb,var(--accent2) 10%,var(--panel2))}
.tone-purple .metric-icon{color:#b6a0ff;background:color-mix(in srgb,#8b6cf0 12%,var(--panel2))}
.dashboard-section,.lower-card{border-radius:16px}
.dashboard-section-head h3,.panel h3{letter-spacing:-.1px}
.dashboard-table th,th{background:var(--panel2)!important;color:var(--muted)!important;border-color:var(--line)!important}
.dashboard-table td,td{border-color:var(--line)}
.dashboard-table tbody tr:hover,tbody tr:hover{background:color-mix(in srgb,var(--accent2) 5%,var(--panel))}
.table-primary{color:var(--accent2)}
.amount.in{color:var(--accent)}.amount.out{color:var(--danger)}
.status-pill{background:var(--soft-green);color:var(--accent)}
.status-pill.is-unknown,.status-pill.is-warning{background:color-mix(in srgb,var(--warn) 13%,var(--panel));color:var(--warn)}
.type-pill{background:var(--soft-blue);color:var(--accent2)}
.open-button{background:var(--soft-blue);border-color:var(--line);color:var(--accent2)}
.accounting-note{background:color-mix(in srgb,var(--warn) 10%,var(--panel));border-color:color-mix(in srgb,var(--warn) 27%,var(--line));color:var(--text)}
.soft-tool{background:var(--panel2);border-color:var(--line)}
.text-link{color:var(--accent2)!important}
.global-search:focus-within{border-color:var(--accent2);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent2) 12%,transparent)}
input:focus,select:focus,textarea:focus{border-color:var(--accent2);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent2) 13%,transparent)}
.modal{border-color:color-mix(in srgb,var(--accent2) 24%,var(--line));background:var(--panel)}
.badge.ok{color:var(--accent);background:var(--soft-green)}
.badge.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--panel))}
.badge.bad{color:var(--danger);background:var(--soft-red)}
.mobile-nav{background:color-mix(in srgb,var(--panel) 93%,var(--accent2));border-top-color:color-mix(in srgb,var(--accent2) 22%,var(--line));backdrop-filter:blur(14px)}
.mobile-nav-item.active{color:var(--accent)}
.footer{color:var(--muted)}
@media(hover:hover){
  .panel,.pos-card,.lower-card,.profile-hero{transition:border-color .18s ease,box-shadow .18s ease}
  .panel:hover,.pos-card:hover,.lower-card:hover,.profile-hero:hover{border-color:color-mix(in srgb,var(--accent2) 36%,var(--line));box-shadow:0 13px 30px rgba(0,0,0,.10)}
  .dash-metric:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 42%,var(--line));box-shadow:0 13px 28px rgba(0,0,0,.14)}
}
@media(max-width:900px){
  .topbar{background:linear-gradient(125deg,var(--panel),color-mix(in srgb,var(--panel) 90%,var(--accent2)));border-bottom-color:color-mix(in srgb,var(--accent2) 20%,var(--line))}
  .dash-metric{min-height:96px}
  .dashboard-quick .primary{box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 16%,transparent)}
}
@media(prefers-reduced-motion:reduce){
  .dash-metric,.panel,.pos-card,.lower-card,.profile-hero,.mobile-nav{transition:none!important;transform:none!important;backdrop-filter:none!important}
}

<script>
(()=>{'use strict';
const KEY='spidernet_accounting_v1';
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=v=>Number(v)||0;const money=v=>new Intl.NumberFormat('ar-YE',{maximumFractionDigits:2}).format(num(v))+' ر.ي';const dateNow=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};function validDateValue(v){if(!/^\d{4}-\d{2}-\d{2}$/.test(String(v||'')))return false;let [y,m,d]=String(v).split('-').map(Number);let x=new Date(Date.UTC(y,m-1,d));return x.getUTCFullYear()===y&&x.getUTCMonth()===m-1&&x.getUTCDate()===d}function dateFieldValue(v,fallback=dateNow()){let s=String(v??'').trim();let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m){let d=m[1]+'-'+String(Number(m[2])).padStart(2,'0')+'-'+String(Number(m[3])).padStart(2,'0');if(validDateValue(d))return d}m=s.match(/^(\d{1,2})[\/. -](\d{1,2})[\/. -](\d{4})$/);if(m){let d=m[3]+'-'+String(Number(m[2])).padStart(2,'0')+'-'+String(Number(m[1])).padStart(2,'0');if(validDateValue(d))return d}return validDateValue(fallback)?fallback:dateNow()}const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

let db=load(),tab='home',selectedPosId=null,posSearch='',posFrom='',posTo='',ledgerFrom='',ledgerTo='',ledgerAccount='';
let lastCommittedState=JSON.stringify(db);function preserveRecovery(raw,reason){
 if(!raw)return;

 try{

 let raw=null;
 try{

  if(savedRecovery)recoveryInfo={available:true,reason:'توجد نسخة خام محفوظة من محاولة استرداد سابقة للرجوع إليها إذا ظهرت مشكلة في البيانات الحالية.',raw:savedRecovery,blocked:false};

  for(const key of arrays){
   if(Array.isArray(x[key]))continue;

function cashReceiptsTotal(){return sum(db.deliveries.filter(x=>x.mode==='cash'&&cashIsInBaseline(x)),x=>x.amount)+sum(db.payments.filter(x=>x.method==='cash'&&cashIsInBaseline(x)),x=>x.amount)+sum(db.walletSales.filter(x=>x.settlement==='received'&&(x.settlementMethod||'cash')==='cash'&&cashIsInBaseline(x)),x=>x.amount)+sum((db.cashMovements||[]).filter(x=>x.kind==='in'&&cashIsInBaseline(x)),x=>x.amount)}
function cashOutflowsTotal(){return sum(db.bills.filter(x=>x.paid&&(x.paidMethod||'cash')==='cash'&&cashIsInBaseline({...x,date:x.paidDate||x.date})),x=>x.amount)+sum(db.expenses.filter(x=>(x.paymentMethod||'cash')==='cash'&&cashIsInBaseline(x)),x=>x.amount)+sum(db.partnerMoves.filter(x=>x.kind==='withdrawal'&&cashIsInBaseline(x)),x=>x.amount)+sum(db.partnerMoves.filter(x=>x.kind==='partner_repayment'&&(x.paymentMethod||'cash')==='cash'&&cashIsInBaseline(x)),x=>x.amount)+sum((db.cashMovements||[]).filter(x=>x.kind==='out'&&cashIsInBaseline(x)),x=>x.amount)}
function cashBalance(){return num(db.settings.cashOpeningBalance)+cashReceiptsTotal()-cashOutflowsTotal()}

function simplePosStatementData(id){
 const deliveries=db.deliveries.filter(x=>x.posId===id).map(x=>({id:x.id,date:x.date,kind:x.mode==='cash'?'بيع نقدي':x.mode==='credit'?'بيع آجل':'تسليم كروت أمانة',card:cardLabel(x.cardId),cardId:x.cardId,qty:num(x.qty),price:num(x.unitPrice),amount:num(x.amount??(num(x.qty)*num(x.unitPrice))),method:x.mode==='cash'?'نقدًا':x.mode==='credit'?'آجل — لم يُسدّد عند التسليم':'أمانة — السداد عند البيع',note:x.mode==='consignment'?'لا يُضاف للدين إلا بعد تسجيل الكروت المباعة':(x.note||''),group:'delivery'}));
 const settles=[];
 db.consignmentSettlements.filter(x=>x.posId===id).forEach(x=>{
  if(num(x.soldQty)>0)settles.push({id:x.id,date:x.date,kind:'بيع كروت من الأمانة',card:cardLabel(x.cardId),cardId:x.cardId,qty:num(x.soldQty),price:num(x.unitPrice),amount:num(x.soldQty)*num(x.unitPrice),method:'مستحق بعد البيع',note:x.note||'تم تسجيل الكروت على أنها مباعة',group:'consignment-sale'});
  if(num(x.returnQty)>0)settles.push({id:x.id,date:x.date,kind:'إرجاع كروت أمانة',card:cardLabel(x.cardId),cardId:x.cardId,qty:num(x.returnQty),price:0,amount:0,method:'مرتجع للمخزون',note:x.note||'أعيد للمخزون',group:'consignment-return'});
 });
 const pays=db.payments.filter(x=>x.posId===id).map(x=>{
  const a=Array.isArray(x.allocations)?x.allocations[0]:null;
  const due=a?(a.sourceType==='delivery'?db.deliveries.find(d=>d.id===a.sourceId):db.consignmentSettlements.find(d=>d.id===a.sourceId)):null;
  return {id:x.id,date:x.date,kind:a?'تسديد دين سابق':'تسديد / تحصيل',card:a?cardLabel(due?.cardId):'—',cardId:due?.cardId||null,qty:null,price:null,amount:num(x.amount),method:x.method==='transfer'?'محفظة / تحويل':'نقدًا',note:x.note||(a?'سداد دين سابق':'تم استلام المبلغ'),group:'payment'};
 });
 const order={'delivery':0,'consignment-sale':1,'consignment-return':2,'payment':3};
 return deliveries.concat(settles,pays).sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))||(order[a.group]??4)-(order[b.group]??4));
}
function simpleOutstandingItems(id){
 const dues=[];
 db.deliveries.filter(x=>x.posId===id&&x.mode==='credit').forEach(x=>{let amount=Math.max(0,num(x.amount)-num(x.returnAmount));if(amount>0.009)dues.push({sourceType:'delivery',sourceId:x.id,date:x.date,card:cardLabel(x.cardId),cardId:x.cardId,qty:num(x.qty),price:num(x.unitPrice),amount,source:'بيع آجل',paidApplied:0,remaining:amount});});
 db.consignmentSettlements.filter(x=>x.posId===id&&num(x.soldQty)>0).forEach(x=>{let amount=num(x.soldQty)*num(x.unitPrice);if(amount>0.009)dues.push({sourceType:'consignment',sourceId:x.id,date:x.date,card:cardLabel(x.cardId),cardId:x.cardId,qty:num(x.soldQty),price:num(x.unitPrice),amount,source:'بيع من الأمانة',paidApplied:0,remaining:amount});});
 dues.sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')));
 for(const payment of db.payments.filter(x=>x.posId===id&&Array.isArray(x.allocations))){
  let budget=Math.max(0,num(payment.amount));
  for(const allocation of payment.allocations){
   if(budget<=0.009)break;
   const due=dues.find(d=>d.sourceType===allocation.sourceType&&String(d.sourceId)===String(allocation.sourceId));
   if(!due)continue;
   const applied=Math.min(budget,Math.max(0,num(allocation.amount)),due.remaining);
   due.remaining-=applied;due.paidApplied+=applied;budget-=applied;
  }
 }
 const unallocated=sum(db.payments.filter(x=>x.posId===id),x=>Math.max(0,num(x.amount)-sum(Array.isArray(x.allocations)?x.allocations:[],a=>a.amount)));
 let available=unallocated;
 for(const due of dues){const applied=Math.min(due.remaining,available);due.remaining-=applied;due.paidApplied+=applied;available-=applied;if(available<=0.009)break;}
 return dues.filter(x=>x.remaining>0.009);
}

 formModal('تسجيل سداد لهذا الدين',[field('تاريخ السداد','date','date',dateNow(),null,true),field('المبلغ الذي استلمته','amount','number',due.remaining,null,true),field('طريقة السداد','method','text','cash',[['cash','نقدًا'],['transfer','محفظة / تحويل']],true),textArea('ملاحظة','note','سداد دين سابق: '+due.card+' — تاريخ البيع '+due.date+' — الكمية '+due.qty+' — المتبقي '+money(due.remaining))],d=>{

  if(amount>due.remaining+0.009)return alert('المبلغ أكبر من المتبقي لهذا الدين ('+money(due.remaining)+').'),false;
  if(amount>Math.max(0,posDebt(id))+0.009)return alert('المبلغ أكبر من إجمالي الدين الحالي ('+money(Math.max(0,posDebt(id)))+').'),false;
  const label=due.card+' / تاريخ البيع '+due.date+' / كمية '+due.qty;
  db.payments.push({id:uid(),date:d.date,posId:id,amount,method:d.method,note:d.note||('سداد دين: '+label),allocations:[{sourceType,sourceId,amount}]});

 });
}

function showModal(title,html,onSave){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modalBack').classList.add('show');$('#modalClose').onclick=closeModal;$('#modalBack').onclick=e=>{if(e.target===$('#modalBack'))closeModal()};$('#modalBody').querySelectorAll('[data-cancel]').forEach(b=>b.onclick=closeModal);$('#modalBody').querySelector('[data-save]')?.addEventListener('click',()=>{if(onSave())closeModal()})}function closeModal(){$('#modalBack').classList.remove('show')}
function field(label,name,type='text',value='',opts=null,required=false){let inputValue=type==='date'?dateFieldValue(value):value;let el=opts?`<select name="${name}" ${required?'required':''}>${opts.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(value)?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`:`<input name="${name}" type="${type}" value="${esc(inputValue)}" ${required?'required':''} ${type==='number'?'step="any"':''}>`;return `<div class="field"><label>${label}${required?' *':''}</label>${el}</div>`}function textArea(label,name,value=''){return `<div class="field wide"><label>${label}</label><textarea name="${name}">${esc(value)}</textarea></div>`}function formHtml(fields,extra=''){return `<form id="dataForm"><div class="form-grid">${fields.join('')}${extra}</div><div class="actions"><button class="primary" type="submit">حفظ العملية</button><button type="button" data-cancel>إلغاء</button></div><p class="small muted">الحقول التي تحمل علامة * مطلوبة. راجع المبلغ والكمية قبل الحفظ.</p></form>`}
function formModal(title,fields,handler){showModal(title,formHtml(fields),()=>false);let f=$('#dataForm');f.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(f).entries());f.querySelectorAll('input[type="date"][name]').forEach(el=>{d[el.name]=dateFieldValue(el.value,'')});for(const el of f.querySelectorAll('input[type="date"][required]')){if(!validDateValue(d[el.name])){alert('اختر تاريخًا صحيحًا قبل الحفظ.');el.focus();return}}if(handler(d)!==false){closeModal();render()}}}

function addCard(id=null){
 let c=id?card(id):null;if(id&&!c)return alert('لم يتم العثور على فئة الكروت المطلوبة.');
 formModal(c?'تعديل فئة كروت':'إضافة فئة كروت',[field('اسم الفئة','name','text',c?.name||'',null,true),field('القيمة الاسمية للكرت (ريال)','face','number',c?.face??'',null,true),field('سعر البيع لنقطة البيع للكرت','pricePos','number',c?.pricePos??'',null,true),field('تكلفة الكرت الفعلية','cost','number',c?.cost??'',null,true),field('المخزون الافتتاحي الفعلي (عدد الكروت)','opening','number',c?.opening??'',null,true),field('حد تنبيه المخزون','alertAt','number',c?.alertAt??0,null,true),textArea('ملاحظات','note',c?.note||'')],d=>{
  const face=Number(d.face),price=Number(d.pricePos),cost=Number(d.cost),opening=Number(d.opening),alertAt=Number(d.alertAt);
  if(!d.name.trim()||d.face.trim()===''||d.pricePos.trim()===''||d.cost.trim()===''||d.opening.trim()===''||!Number.isFinite(face)||!Number.isFinite(price)||!Number.isFinite(cost)||!Number.isFinite(opening)||!Number.isFinite(alertAt)||face<=0||price<0||cost<0||opening<0||Math.floor(opening)!==opening||alertAt<0||Math.floor(alertAt)!==alertAt)return alert('راجع بيانات الفئة. المخزون وحد التنبيه يجب أن يكونا أعدادًا صحيحة غير سالبة.'),false;
  if(c){const hasHistory=db.deliveries.some(x=>x.cardId===c.id)||db.consignmentSettlements.some(x=>x.cardId===c.id)||db.walletLoads.some(x=>x.cardId===c.id)||db.walletSales.some(x=>x.cardId===c.id)||db.stockAdjustments.some(x=>x.cardId===c.id);if(hasHistory&&(cost!==num(c.cost)||opening!==num(c.opening)))return alert('لا يمكن تغيير تكلفة الكرت أو مخزونه الافتتاحي بعد تسجيل حركات عليه؛ حتى لا تتغير حسابات العمليات السابقة.'),false;Object.assign(c,{name:d.name.trim(),face,pricePos:price,cost,opening,alertAt,note:d.note});addAudit('تعديل فئة',c.name)}
  else{db.cards.push({id:uid(),name:d.name.trim(),face,pricePos:price,cost,opening,alertAt,note:d.note});addAudit('إضافة فئة',d.name.trim())}
  return persist();

function restoreCommittedState(){
 let snapshot;
 try{snapshot=JSON.parse(lastCommittedState||'null')||empty()}catch(e){db=empty();return}
 if(!db||typeof db!=='object'||Array.isArray(db)){db=snapshot;return}
 const current=db;
 const keep=new Set(Object.keys(snapshot));
 Object.keys(current).forEach(key=>{if(!keep.has(key))delete current[key]});
 for(const [key,saved] of Object.entries(snapshot)){
  if(Array.isArray(saved)){
   const rows=Array.isArray(current[key])?current[key]:[];
   const byId=new Map();
   rows.forEach(row=>{if(row&&typeof row==='object'&&!Array.isArray(row)&&row.id!==undefined&&row.id!==null)byId.set(String(row.id),row)});
   const restored=saved.map(savedRow=>{
    if(savedRow&&typeof savedRow==='object'&&!Array.isArray(savedRow)&&savedRow.id!==undefined&&savedRow.id!==null){
     const existing=byId.get(String(savedRow.id));
     if(existing){
      Object.keys(existing).forEach(field=>{if(!Object.prototype.hasOwnProperty.call(savedRow,field))delete existing[field]});
      Object.assign(existing,savedRow);
      return existing;
     }
    }
    return savedRow;
   });
   rows.splice(0,rows.length,...restored);
   current[key]=rows;
  }else if(saved&&typeof saved==='object'&&!Array.isArray(saved)){
   let target=current[key];
   if(!target||typeof target!=='object'||Array.isArray(target))target={};
   Object.keys(target).forEach(field=>{if(!Object.prototype.hasOwnProperty.call(saved,field))delete target[field]});
   Object.assign(target,saved);
   current[key]=target;
  }else current[key]=saved;
 }
}

  serialized=JSON.stringify(db);
  localStorage.setItem(KEY,serialized);
  lastCommittedState=serialized;

 }catch(e){
  restoreCommittedState();

  if(totalReturn>0&&stockMain(row.cardId)-totalReturn<0)return alert('لا يمكن حذف المرتجع لأن ذلك سيجعل المخزون الرئيسي سالبًا.');

 }else if(type==='walletSale'){
  row=find('walletSales');if(!row)return alert('عملية بيع المحفظة غير موجودة.');
  if(stockWallet(row.walletId,row.cardId)+num(row.qty)<num(row.qty))return alert('تعذر التحقق من مخزون المحفظة؛ لم يتم الحذف.');
  label='بيع محفظة';detail=(wallet(row.walletId)?.name||'')+' / '+cardLabel(row.cardId)+' / '+row.qty+' / '+money(row.amount);linked=[['walletSales',row]];
 }else if(type==='expense'){
  row=find('expenses');if(!row)return alert('المصروف غير موجود.');
  label='حذف مصروف';detail=row.name+' / '+money(row.amount);
  linked=[['expenses',row],...db.partnerMoves.filter(x=>String(x.expenseId)===String(id)).map(x=>['partnerMoves',x])];
 }else if(type==='bill'){
  row=find('bills');if(!row)return alert('الالتزام غير موجود.');
  label='حذف التزام / فاتورة';detail=row.name+' / '+money(row.amount)+(row.paid?' / مسدد':' / غير مسدد');
  linked=[['bills',row],...db.partnerMoves.filter(x=>String(x.billId)===String(id)).map(x=>['partnerMoves',x])];
 }else if(type==='walletLoad'){
  row=find('walletLoads');if(!row)return alert('تحويل المخزون غير موجود.');
  if(stockWallet(row.walletId,row.cardId)<0)return alert('مخزون المحفظة غير صحيح؛ لم يتم حذف التحويل.');
  if(stockWallet(row.walletId,row.cardId)<num(row.qty))return alert('لا يمكن حذف تحويل المخزون لأن الكمية المحولة استُخدمت في مبيعات لاحقة. صحح المبيعات أو سجّل تسوية مخزون أولًا.');
  label='حذف تحويل مخزون إلى محفظة';detail=(wallet(row.walletId)?.name||'')+' / '+cardLabel(row.cardId)+' / '+row.qty;linked=[['walletLoads',row]];
 }else if(type==='stockAdjustment'){
  row=find('stockAdjustments');if(!row)return alert('تسوية المخزون غير موجودة.');
  if(stockMain(row.cardId)-num(row.delta)<0)return alert('لا يمكن حذف تسوية المخزون لأن ذلك سيجعل المخزون الرئيسي سالبًا.');
  label='حذف تسوية مخزون';detail=cardLabel(row.cardId)+' / '+row.delta+' / '+(row.note||'');linked=[['stockAdjustments',row]];
 }else if(type==='partnerMove'){
  row=find('partnerMoves');if(!row)return alert('حركة الشريك غير موجودة.');
  if(row.expenseId||row.billId)return alert('هذه الحركة ناتجة عن مصروف أو فاتورة. احذف السجل الأصلي من شاشة المصروفات والالتزامات حتى تُعالج الارتباطات معًا.');
  label='حذف حركة شريك';detail=(db.partners.find(p=>p.id===row.partnerId)?.name||'')+' / '+row.kind+' / '+money(row.amount);linked=[['partnerMoves',row]];
 }else return alert('نوع العملية غير مدعوم للحذف حتى الآن.');
 if(!confirm('تأكيد حذف '+label+'؟\n'+detail+'\nسيُعاد احتساب الأرصدة والتقارير من الحركات المتبقية، وسيُسجّل الحذف في سجل التدقيق.'))return false;
 for(const [key,item] of linked)remove(key,item);
 addAudit(label,detail+' / حذف بطلب المستخدم');
 const deletionAudit=db.audit[0];deletionAudit.undoSnapshot=linked.map(([key,item])=>({key,row:JSON.parse(JSON.stringify(item))}));
 if(!persist()){render();return false}
 render();return true;
}
function runAction(a){if(typeof a!=='string'||!a.trim())return alert('تعذر تنفيذ الزر: لم يتم تحديد الإجراء.');let [act,id]=a.split(':');switch(act){case'undo-delete':return undoDeletedTransaction(id);case'delete':{const parts=a.split(':');return deleteTransaction(parts[1],parts.slice(2).join(':'))}case'edit-delivery':return editDelivery(id);case'edit-payment':return editPayment(id);case'pay-debt-delivery':return paySpecificDebt('delivery',id);case'pay-debt-consignment':return paySpecificDebt('consignment',id);case'quick':return quick();case'add-cash-movement':return addCashMovement();case'add-journal-entry':return addJournalEntry();case'reverse-journal':return reverseJournalEntry(id);case'print-bill':return printBill(id);case'print-expense':return printExpense(id);case'accounting-filter':{const f=$('#ledgerFrom')?.value||'',t=$('#ledgerTo')?.value||'',a=$('#ledgerAccount')?.value||'';if(f&&!validDateValue(f))return alert('تاريخ البداية غير صالح.');if(t&&!validDateValue(t))return alert('تاريخ النهاية غير صالح.');if(f&&t&&f>t)return alert('تاريخ البداية يجب ألا يتجاوز تاريخ النهاية.');ledgerFrom=f;ledgerTo=t;ledgerAccount=a;return render()}case'accounting-reset-filter':ledgerFrom='';ledgerTo='';ledgerAccount='';return render();case'print-accounting':return printAccounting();case'open-pos':selectedPosId=id;posFrom='';posTo='';tab='pos-detail';return render();case'back-pos':tab='pos';return render();case'print-pos':return printPosStatement();case'image-pos':return exportPosImage();case'add-card':return addCard();case'edit-card':return addCard(id);case'add-pos':return addPos();case'edit-pos':return addPos(id);case'add-wallet':return addWallet();case'add-delivery':return addDelivery();case'deliver-to':return addDelivery(id);case'add-payment':return addPayment();case'payment-to':return addPayment(id);case'consign-to':return addConsignmentSettlement(id);case'add-load':return addLoad();case'load-to':return addLoad(id);case'add-wallet-sale':return addWalletSale();case'sale-from':return addWalletSale(id);case'add-expense':return addExpense();case'add-bill':return addBill();case'edit-bill':return editBill(id);case'pay-bill':return payBill(id);case'add-partner-move':return addPartnerMove();case'partner-move':return addPartnerMove(id);case'statement':return statement(id);case'wallet-stock':return walletStock(id);case'backup':return backup();case'restore':return restore();case'recovery-backup':return exportRecoveryCopy();case'export-audit':return exportAudit();case'save-settings':return saveSettings();case'change-pin':return changePin();case'integrity':return integrity();case'close-period':return closePeriod();case'print-report':return requestPrint('تقرير SPIDER NET');case'adjust-stock':return adjustStock(id);case'edit-partner':return editPartner(id);default:return alert('هذا الزر مرتبط بإجراء غير معروف: '+act+'، لم تُنفذ أي تغييرات. راجع ربط الأزرار.');}}
function adjustStock(id){let c=card(id);if(!c)return alert('فئة الكروت غير موجودة.');let delta=prompt('تسوية كمية المخزون لفئة '+c.name+'. أدخل عددًا صحيحًا: موجب للإضافة وسالب للنقص.');if(delta===null||delta.trim()===''||!Number.isFinite(Number(delta)))return;let n=Number(delta);if(!Number.isInteger(n)||n===0)return alert('يجب أن يكون التغيير عددًا صحيحًا من الكروت، وليس صفرًا.');if(stockMain(id)+n<0)return alert('لا يمكن أن يصبح المخزون سالبًا.');let note=prompt('سبب التسوية (مطلوب):');if(!note?.trim())return alert('يجب توثيق السبب.');db.stockAdjustments.push({id:uid(),date:dateNow(),cardId:id,delta:n,note:note.trim()});addAudit('تسوية مخزون',c.name+' / '+n+' / '+note.trim());persist();render()}
function editPartner(id){let p=db.partners.find(x=>x.id===id);if(!p)return alert('لم يتم العثور على الشريك.');let n=prompt('اسم الشريك:',p.name);if(!n?.trim())return;p.name=n.trim();addAudit('تعديل اسم شريك',p.name);persist();render()}
function printPosStatement(){if(tab!=='pos-detail'||!pos(selectedPosId))return;document.body.classList.add('printing-pos');if(window.AndroidBackup&&typeof window.AndroidBackup.printPage==='function'){requestPrint('كشف حساب نقطة البيع');return;}window.print();document.body.classList.remove('printing-pos')}

function exportPosImage(){
 const p=pos(selectedPosId);if(!p)return;
 const rows=simplePosStatementData(selectedPosId).filter(x=>(!posFrom||x.date>=posFrom)&&(!posTo||x.date<=posTo));
 const due=simpleOutstandingItems(selectedPosId);
 if(rows.length>250||due.length>70)return alert('يتجاوز هذا الكشف حد الصورة المدمج ('+rows.length+' عملية و'+due.length+' دينًا). لم يتم تصدير صورة ناقصة؛ استخدم الطباعة ثم حفظ PDF لتصدير الكشف كاملًا.');
 const width=1600,rowH=42;

 const dark=document.documentElement.dataset.theme==='dark';
 ctx.fillStyle='#ffffff';ctx.fillRect(0,0,width,height);ctx.direction='rtl';ctx.textAlign='right';ctx.fillStyle='#173a5e';ctx.font='bold 32px Tahoma, Arial';
 ctx.fillText('SPIDER NET — كشف حساب نقطة بيع',width-45,48);
 ctx.font='bold 25px Tahoma, Arial';ctx.fillText(p.name,width-45,88);
 ctx.font='18px Tahoma, Arial';ctx.fillText('المالك: '+(p.owner||'—')+'   الهاتف: '+(p.phone||'—'),width-45,124);
 ctx.fillText('المنطقة: '+(p.area||'—')+'   العنوان: '+(p.address||'—'),width-45,156);
 ctx.fillText('الفترة: '+(posFrom||'أول تعامل')+' إلى '+(posTo||'حتى اليوم'),width-45,188);
 const headers=['التاريخ','نوع العملية','فئة الكرت','الكمية','سعر الكرت','القيمة','طريقة التسديد','ملاحظات'];
 const cols=[1550,1360,1120,900,785,625,450,205];
 ctx.fillStyle='#e8f0f7';ctx.fillRect(25,215,width-50,44);ctx.fillStyle='#173a5e';ctx.font='bold 15px Tahoma, Arial';headers.forEach((v,i)=>ctx.fillText(v,cols[i],243));
 let y=285;ctx.font='14px Tahoma, Arial';
 rows.slice(0,250).forEach((r,i)=>{if(i%2===0){ctx.fillStyle='#f7fafc';ctx.fillRect(25,y-29,width-50,rowH)}ctx.fillStyle='#213b55';const vals=[r.date,r.kind,r.card,r.qty===null?'—':String(r.qty),r.price===null?'—':money(r.price),money(r.amount),r.method,r.note||''];vals.forEach((v,j)=>ctx.fillText(String(v).slice(0,38),cols[j],y));y+=rowH});
 y+=15;ctx.fillStyle='#173a5e';ctx.font='bold 20px Tahoma, Arial';ctx.fillText('الملخص',width-45,y);y+=34;ctx.font='16px Tahoma, Arial';
 const lines=[['مبيعات نقدية',money(sum(db.deliveries.filter(x=>x.posId===selectedPosId&&x.mode==='cash'&&(!posFrom||x.date>=posFrom)&&(!posTo||x.date<=posTo)),x=>x.amount))],['مبيعات آجلة وأمانة مباعة',money(sum(db.deliveries.filter(x=>x.posId===selectedPosId&&x.mode==='credit'&&(!posFrom||x.date>=posFrom)&&(!posTo||x.date<=posTo)),x=>x.amount)+sum(db.consignmentSettlements.filter(x=>x.posId===selectedPosId&&(!posFrom||x.date>=posFrom)&&(!posTo||x.date<=posTo)),x=>x.soldQty*x.unitPrice))],['المبلغ المستلم',money(sum(db.payments.filter(x=>x.posId===selectedPosId&&(!posFrom||x.date>=posFrom)&&(!posTo||x.date<=posTo)),x=>x.amount))],['الرصيد الآجل الحالي',money(Math.max(0,posDebt(selectedPosId)))]];
 lines.forEach((it,i)=>{ctx.fillStyle=i%2===0?'#f2f7fa':'#ffffff';ctx.fillRect(25,y-24,width-50,32);ctx.fillStyle='#213b55';ctx.fillText(it[0],width-45,y);ctx.textAlign='left';ctx.fillText(it[1],80,y);ctx.textAlign='right';y+=36});
 if(due.length){y+=12;ctx.fillStyle='#173a5e';ctx.font='bold 19px Tahoma, Arial';ctx.fillText('الديون المتبقية',width-45,y);y+=32;due.slice(0,70).forEach((d,i)=>{if(y>c.height-25)return;ctx.fillStyle=i%2===0?'#fff7e7':'#ffffff';ctx.fillRect(25,y-24,width-50,32);ctx.fillStyle='#573f17';ctx.fillText(d.date+' — '+d.card+' — المتبقي '+money(d.remaining),width-45,y);y+=36})}
 ctx.fillStyle='#71839a';ctx.font='13px Tahoma, Arial';ctx.fillText('هذا الكشف خاص بنقطة البيع المذكورة أعلاه فقط.',width-45,Math.min(c.height-12,y+22));
 const fileName='spider-net-statement-'+p.name.replace(/[^\u0600-\u06FF\w-]+/g,'_')+'-'+dateNow()+'.png';
 c.toBlob(blob=>{
  if(!blob)return alert('تعذر إنشاء الصورة. استخدم الطباعة ثم احفظ PDF.');
  if(window.AndroidBackup&&typeof window.AndroidBackup.saveImage==='function'){
   try{
    const reader=new FileReader();
    reader.onerror=()=>alert('تعذر تجهيز الصورة للحفظ على Android.');
    reader.onload=()=>{
     const result=String(reader.result||''),comma=result.indexOf(','),encoded=comma>=0?result.slice(comma+1):'';
     if(!encoded)return alert('تعذر ترميز صورة الكشف.');
     try{window.AndroidBackup.saveImage(encoded,fileName)}catch(e){alert('تعذر طلب حفظ الصورة: '+(e&&e.message?e.message:'خطأ غير معروف'))}
    };
    reader.readAsDataURL(blob);
   }catch(e){alert('تعذر تجهيز الصورة للحفظ: '+(e&&e.message?e.message:'خطأ غير معروف'))}

  }
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=fileName;a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1500);
 },'image/png');
}
function setTheme(theme){document.documentElement.dataset.theme=theme;localStorage.setItem('spidernet_theme',theme);let label=theme==='dark'?'الوضع الفاتح':'الوضع الداكن';let b=$('#themeBtn');if(b){b.title=label;b.setAttribute('aria-label',label)}document.querySelectorAll('.theme-label').forEach(x=>x.textContent=label);document.querySelectorAll('.theme-icon').forEach(x=>x.textContent=theme==='dark'?'☼':'☾')}

setTheme(localStorage.getItem('spidernet_theme')==='light'?'light':'dark');$('#themeBtn').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');$('#sidebarTheme').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');document.addEventListener('click',e=>{if(e.target.closest('#themeShortcut'))setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');if(e.target.closest('#backupShortcut'))backup()});$('#backupBtn').onclick=backup;$('#restoreBtn').onclick=restore;$('#printBtn').onclick=()=>requestPrint('تقرير SPIDER NET');$('#menuToggle').onclick=()=>document.body.classList.toggle('nav-open');$('#closeMenu').onclick=closeMobileNav;$('#navScrim').onclick=closeMobileNav;$('#notificationBtn').onclick=()=>{const items=alerts();const body=items.length?`<div class="alert-list">${items.map(a=>`<div class="note ${a.type==='bad'?'danger-note':'warning'}"><b>${a.type==='bad'?'يتطلب مراجعة':'تنبيه'}</b><p>${esc(a.text)}</p></div>`).join('')}</div>`:'<div class="note">لا توجد تنبيهات بناءً على البيانات المسجلة حاليًا.</div>';showModal('مركز التنبيهات',body)};$('#profileBtn').onclick=()=>{tab='settings';render()};$('#settingsBtn').onclick=()=>{tab='settings';render()};document.addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(b&&b.closest('#view')){e.preventDefault();tab=b.dataset.tab;render()}});$('#globalSearch').addEventListener('keydown',e=>{if(e.key!=='Enter')return;const q=e.currentTarget.value.trim().toLocaleLowerCase('ar');if(!q)return;const matches=db.pos.filter(p=>[p.name,p.owner,p.phone,p.area,p.address].some(v=>String(v||'').toLocaleLowerCase('ar').includes(q)));if(matches.length===1){selectedPosId=matches[0].id;tab='pos-detail';render();e.currentTarget.value='';return}if(matches.length>1){tab='pos';render();const ps=document.querySelector('#posSearch');if(ps){ps.value=q;ps.dispatchEvent(new Event('input',{bubbles:true}))}return}const cardHit=db.cards.some(c=>String(c.name||'').toLocaleLowerCase('ar').includes(q));if(cardHit){tab='cards';render();e.currentTarget.value='';return}alert('لم نعثر على نقطة بيع أو فئة كروت بهذا البحث.');});$('#restoreFile').onchange=async e=>{let f=e.target.files?.[0];if(!f)return;try{applyBackupText(await f.text(),f.name)}catch(err){alert('تعذرت قراءة ملف النسخة الاحتياطية.')}finally{e.target.value=''}};
$('#lockBtn').onclick=()=>{if(!db.settings.pin)return alert('عيّن رقمًا سريًا من الإعدادات أولًا.');$('#lockScreen').classList.add('show')};$('#unlockBtn').onclick=()=>{if($('#unlockPin').value===db.settings.pin){$('#lockScreen').classList.remove('show');$('#unlockPin').value='';$('#unlockMsg').textContent=''}else $('#unlockMsg').textContent='الرقم السري غير صحيح.'};

 if(document.body.classList.contains('nav-open')){closeMobileNav();return true}
