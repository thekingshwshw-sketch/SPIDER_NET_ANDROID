/* SPIDER NET — consolidated foundation styles; old experimental themes removed */
*{box-sizing:border-box}

.section-title{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 13px}

row{display:flex;align-items:center;gap:10px;min-width:0}

/* SPIDER NET 2.1 — visual system inspired by React Bits motion discipline and IT Tools clarity.
   Vanilla CSS only: no React runtime, remote assets, or heavy animation dependency. */
html[data-theme="dark"]{
  --bg:#071321;--panel:#0d1e30;--panel2:#11283e;--line:#23415a;
  --text:#eef7ff;--muted:#9db2c7;--accent:#9af542;--accent2:#22d3db;
  --danger:#ff788f;--warn:#ffd166;--shadow:0 12px 30px rgba(0,0,0,.22);
  --soft-blue:#142f49;--soft-green:#12382e;--soft-red:#412333;--soft-purple:#292643;color-scheme:dark
}
html[data-theme="light"]{
  --bg:#eef4f8;--panel:#ffffff;--panel2:#f4f8fb;--line:#d7e3eb;
  --text:#173149;--muted:#60798c;--accent:#16865f;--accent2:#078da5;
  --danger:#c9435d;--warn:#986b16;--shadow:0 9px 24px rgba(17,48,71,.075);
  --soft-blue:#e3f3f7;--soft-green:#e1f6eb;--soft-red:#ffedf0;--soft-purple:#efeaff;color-scheme:light
}
body{
  background-color:var(--bg);
  background-image:radial-gradient(ellipse at 88% 0%,rgba(34,211,219,.075),transparent 34%),radial-gradient(ellipse at 10% 30%,rgba(154,245,66,.045),transparent 28%);
  color:var(--text)
}
.topbar{
  background:linear-gradient(115deg,var(--panel),color-mix(in srgb,var(--panel) 91%,var(--accent2)));
  border-bottom:1px solid color-mix(in srgb,var(--accent2) 22%,var(--line));
  box-shadow:0 8px 24px rgba(0,0,0,.07)
}
.brand-emblem{background:linear-gradient(135deg,#092038,#123c55);border:1px solid #1c5b70;box-shadow:inset 0 0 15px #22d3db12,0 0 16px #22d3db0c}
.brand-emblem svg{stroke:var(--accent2)}
.sidebar{background:linear-gradient(180deg,#081a2b 0%,#0a2137 58%,#091827 100%);border-color:#193c53}
.sidebar .nav.active{background:linear-gradient(100deg,#103b49,#134153);border-color:#297a7e;box-shadow:inset -3px 0 var(--accent),0 4px 14px #0002}
.dashboard-head{position:relative}
.dashboard-head h2{letter-spacing:-.35px}
.dashboard-welcome{color:var(--text)}
.dashboard-quick .primary,button.primary{
  background:linear-gradient(115deg,var(--accent),color-mix(in srgb,var(--accent) 64%,var(--accent2)));
  border:1px solid color-mix(in srgb,var(--accent) 70%,white);
  color:#071720;font-weight:800;box-shadow:0 5px 16px color-mix(in srgb,var(--accent) 18%,transparent)
}
.dash-metric,.metric,.panel,.pos-card,.profile-hero,.lower-card,.detail-stat{
  border:1px solid var(--line);
  background:linear-gradient(145deg,var(--panel),color-mix(in srgb,var(--panel) 93%,var(--accent2)));
  box-shadow:var(--shadow)
}
.dash-metric{overflow:hidden;transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease}
.dash-metric:before{display:block;content:"";position:absolute;right:0;top:15px;bottom:15px;width:3px;border-radius:4px;background:linear-gradient(180deg,var(--accent),var(--accent2))}
.dash-metric .label,.dash-metric .hint{color:var(--muted)}
.dash-metric .value{color:var(--text)}
.metric-icon{background:color-mix(in srgb,var(--accent2) 12%,var(--panel2));color:var(--accent2);border:1px solid color-mix(in srgb,var(--accent2) 25%,var(--line))}
.tone-green .metric-icon{color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--panel2))}
.tone-red .metric-icon{color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,var(--panel2))}
.tone-blue .metric-icon{color:var(--accent2);background:color-mix(in srgb,var(--accent2) 10%,var(--panel2))}
.tone-purple .metric-icon{color:#b6a0ff;background:color-mix(in srgb,#8b6cf0 12%,var(--panel2))}
.dashboard-section,.lower-card{border-radius:16px}
.dashboard-section-head h3,.panel h3{letter-spacing:-.1px}
.dashboard-table th,th{background:var(--panel2)!important;color:var(--muted)!important;border-color:var(--line)!important}
.dashboard-table td,td{border-color:var(--line)}
.dashboard-table tbody tr:hover,tbody tr:hover{background:color-mix(in srgb,var(--accent2) 5%,var(--panel))}
.table-primary{color:var(--accent2)}
.amount.in{color:var(--accent)}.amount.out{color:var(--danger)}
.status-pill{background:var(--soft-green);color:var(--accent)}
.status-pill.is-unknown,.status-pill.is-warning{background:color-mix(in srgb,var(--warn) 13%,var(--panel));color:var(--warn)}
.type-pill{background:var(--soft-blue);color:var(--accent2)}
.open-button{background:var(--soft-blue);border-color:var(--line);color:var(--accent2)}
.accounting-note{background:color-mix(in srgb,var(--warn) 10%,var(--panel));border-color:color-mix(in srgb,var(--warn) 27%,var(--line));color:var(--text)}
.soft-tool{background:var(--panel2);border-color:var(--line)}
.text-link{color:var(--accent2)!important}
.global-search:focus-within{border-color:var(--accent2);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent2) 12%,transparent)}
input:focus,select:focus,textarea:focus{border-color:var(--accent2);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent2) 13%,transparent)}
.modal{border-color:color-mix(in srgb,var(--accent2) 24%,var(--line));background:var(--panel)}
.badge.ok{color:var(--accent);background:var(--soft-green)}
.badge.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--panel))}
.badge.bad{color:var(--danger);background:var(--soft-red)}
.mobile-nav{background:color-mix(in srgb,var(--panel) 93%,var(--accent2));border-top-color:color-mix(in srgb,var(--accent2) 22%,var(--line));backdrop-filter:blur(14px)}
.mobile-nav-item.active{color:var(--accent)}
.footer{color:var(--muted)}
@media(hover:hover){
  .panel,.pos-card,.lower-card,.profile-hero{transition:border-color .18s ease,box-shadow .18s ease}
  .panel:hover,.pos-card:hover,.lower-card:hover,.profile-hero:hover{border-color:color-mix(in srgb,var(--accent2) 36%,var(--line));box-shadow:0 13px 30px rgba(0,0,0,.10)}
  .dash-metric:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 42%,var(--line));box-shadow:0 13px 28px rgba(0,0,0,.14)}
}
@media(max-width:900px){
  .topbar{background:linear-gradient(125deg,var(--panel),color-mix(in srgb,var(--panel) 90%,var(--accent2)));border-bottom-color:color-mix(in srgb,var(--accent2) 20%,var(--line))}
  .dash-metric{min-height:96px}
  .dashboard-quick .primary{box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 16%,transparent)}
}
@media(prefers-reduced-motion:reduce){
  .dash-metric,.panel,.pos-card,.lower-card,.profile-hero,.mobile-nav{transition:none!important;transform:none!important;backdrop-filter:none!important}
}

<script>
(()=>{'use strict';
const KEY='spidernet_accounting_v1';
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=v=>Number(v)||0;const money=v=>new Intl.NumberFormat('ar-YE',{maximumFractionDigits:2}).format(num(v))+' ر.ي';const dateNow=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};function validDateValue(v){if(!/^\d{4}-\d{2}-\d{2}$/.test(String(v||'')))return false;let [y,m,d]=String(v).split('-').map(Number);let x=new Date(Date.UTC(y,m-1,d));return x.getUTCFullYear()===y&&x.getUTCMonth()===m-1&&x.getUTCDate()===d}function dateFieldValue(v,fallback=dateNow()){let s=String(v??'').trim();let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m){let d=m[1]+'-'+String(Number(m[2])).padStart(2,'0')+'-'+String(Number(m[3])).padStart(2,'0');if(validDateValue(d))return d}m=s.match(/^(\d{1,2})[\/. -](\d{1,2})[\/. -](\d{4})$/);if(m){let d=m[3]+'-'+String(Number(m[2])).padStart(2,'0')+'-'+String(Number(m[1])).padStart(2,'0');if(validDateValue(d))return d}return validDateValue(fallback)?fallback:dateNow()}const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
let recoveryInfo={available:false,reason:'',raw:null,blocked:false};
let recoveryExportPending=false;
const empty=()=>({version:1,settings:{startDate:'2026-11-01',pin:'',lastBackup:'',lastClose:''},cards:[],pos:[],wallets:[],deliveries:[],consignmentSettlements:[],payments:[],walletLoads:[],walletSales:[],expenses:[],bills:[],partners:[{id:'p1',name:'الشريك الأول',share:50},{id:'p2',name:'الشريك الثاني',share:50}],partnerMoves:[],stockAdjustments:[],audit:[],closures:[]});
let db=load(),tab='home',selectedPosId=null,posSearch='',posFrom='',posTo='';
let lastCommittedState=JSON.stringify(db);function preserveRecovery(raw,reason){
 if(!raw)return;
 let saved=false;
 try{
  const existing=localStorage.getItem(KEY+'_recovery');
  const latest=localStorage.getItem(KEY+'_recovery_latest');
  if(!existing){localStorage.setItem(KEY+'_recovery',raw);saved=true}
  else if(existing===raw||latest===raw)saved=true;
  else{localStorage.setItem(KEY+'_recovery_latest',raw);saved=true}
 }catch(e){saved=false}
 recoveryInfo={available:true,reason:reason+(saved?'':' تعذر حفظ نسخة إضافية في التخزين المحلي؛ لن يُسمح بحفظ تغييرات جديدة حتى تصدير هذه البيانات.'),raw,blocked:true};
}
function load(){
 let raw=null;
 try{
  const savedRecovery=localStorage.getItem(KEY+'_recovery_latest')||localStorage.getItem(KEY+'_recovery');
  if(savedRecovery)recoveryInfo={available:true,reason:'توجد نسخة بيانات معزولة من محاولة استرداد سابقة. نزّلها واحتفظ بها قبل حذف أي بيانات.',raw:savedRecovery,blocked:false};
  raw=localStorage.getItem(KEY);
  let x;
  try{x=JSON.parse(raw||'null')}catch(parseError){if(raw)preserveRecovery(raw,'تعذر تحليل بيانات التطبيق المخزنة؛ تم عزل النص الخام للمحاولة اليدوية.');return empty()}
  if(!x||x.version!==1||typeof x!=='object'||Array.isArray(x)){if(raw)preserveRecovery(raw,'تنسيق بيانات التطبيق غير متوافق؛ لم تُحذف النسخة الخام.');return empty()}
  const defaults=empty();
  let changed=false,damaged=false;
  const arrays=['cards','pos','wallets','deliveries','consignmentSettlements','payments','walletLoads','walletSales','expenses','bills','partners','partnerMoves','stockAdjustments','audit','closures'];
  for(const key of arrays){
   if(Array.isArray(x[key]))continue;
   if(x[key]!==undefined&&x[key]!==null)damaged=true;
   x[key]=defaults[key];changed=true;
  }
  if(!x.settings||typeof x.settings!=='object'||Array.isArray(x.settings)){
   if(x.settings!==undefined&&x.settings!==null)damaged=true;
   x.settings={...defaults.settings};changed=true;
  }else{
   for(const key of Object.keys(defaults.settings)){
    if(x.settings[key]===undefined){x.settings[key]=defaults.settings[key];changed=true;}
   }
  }
  if(damaged&&raw)preserveRecovery(raw,'بنية بيانات التطبيق تحتوي على حقول غير سليمة؛ تم حفظ نسخة خام قبل إصلاح البنية الأساسية.');
  if(changed){
   try{localStorage.setItem(KEY,JSON.stringify(x))}catch(e){}
  }
  return x;
 }catch(e){
  if(raw)preserveRecovery(raw,'تعذر تحميل البيانات المخزنة؛ تم الاحتفاظ بنسخة خام إن أمكن.');
  return empty();
 }
}
function save(action,detail=''){if(action)addAudit(action,detail,false);if(!persist())return false;render();return true}function addAudit(action,detail,doSave=false){db.audit.unshift({id:uid(),date:dateNow(),time:new Date().toLocaleTimeString('ar-YE'),action,detail});db.audit=db.audit.slice(0,1000);return doSave?persist():true}
function sum(arr,fn){return arr.reduce((s,x)=>s+num(fn(x)),0)}function card(id){return db.cards.find(x=>x.id===id)}function pos(id){return db.pos.find(x=>x.id===id)}function wallet(id){return db.wallets.find(x=>x.id===id)}function cCost(c){return num(c?.cost)}function cardLabel(id){let c=card(id);return c?`${c.name} (${money(c.face)})`:'فئة محذوفة'}
function posDebt(id){return sum(db.deliveries.filter(x=>x.posId===id&&x.mode==='credit'),x=>x.amount)+sum(db.consignmentSettlements.filter(x=>x.posId===id),x=>x.soldQty*x.unitPrice)-sum(db.payments.filter(x=>x.posId===id),x=>x.amount)-sum(db.deliveries.filter(x=>x.posId===id&&x.mode==='credit'),x=>x.returnAmount||0)}function posHasMovements(id){return db.deliveries.some(x=>x.posId===id)||db.consignmentSettlements.some(x=>x.posId===id)||db.payments.some(x=>x.posId===id)}
function stockMain(cardId){let opening=num(card(cardId)?.opening);let delivered=sum(db.deliveries.filter(x=>x.cardId===cardId),x=>x.qty);let loaded=sum(db.walletLoads.filter(x=>x.cardId===cardId),x=>x.qty);let adjustments=sum(db.stockAdjustments.filter(x=>x.cardId===cardId),x=>x.delta);let consignmentReturns=sum(db.consignmentSettlements.filter(x=>x.cardId===cardId),x=>x.returnQty);return opening-delivered-loaded+adjustments+consignmentReturns}
function stockWallet(walletId,cardId){let opening=sum(db.wallets.filter(x=>x.id===walletId),w=>(w.opening||{})[cardId]||0);return opening+sum(db.walletLoads.filter(x=>x.walletId===walletId&&x.cardId===cardId),x=>x.qty)-sum(db.walletSales.filter(x=>x.walletId===walletId&&x.cardId===cardId),x=>x.qty)}
function walletCash(){return sum(db.walletSales,x=>x.amount)}function cashBalance(){
 const cashSales=sum(db.deliveries.filter(x=>x.mode==='cash'),x=>x.amount);
 const cashReceipts=sum(db.payments.filter(x=>x.method==='cash'),x=>x.amount);
 // Old records without settlementMethod retain the app's previous cash treatment.
 const cashWalletSales=sum(db.walletSales.filter(x=>x.settlement==='received'&&(x.settlementMethod||'cash')==='cash'),x=>x.amount);
 // Legacy paid bills without a method remain cash to preserve their previous balance impact.
 const billsPaidCash=sum(db.bills.filter(x=>x.paid&&(x.paidMethod||'cash')==='cash'),x=>x.amount);
 const expenses=sum(db.expenses,x=>x.amount);
 const partnerWithdraw=sum(db.partnerMoves.filter(x=>x.kind==='withdrawal'),x=>x.amount);
 return cashSales+cashReceipts+cashWalletSales-expenses-billsPaidCash-partnerWithdraw;
}
function transferReceipts(){
 return sum(db.payments.filter(x=>x.method==='transfer'),x=>x.amount)
  +sum(db.walletSales.filter(x=>x.settlement==='received'&&x.settlementMethod==='transfer'),x=>x.amount);
}
function transferBillPayments(){return sum(db.bills.filter(x=>x.paid&&x.paidMethod==='transfer'),x=>x.amount);}

function obligations(){return sum(db.bills.filter(x=>!x.paid),x=>x.amount)}function posReceivables(){return sum(db.pos,x=>Math.max(0,posDebt(x.id)))}function mainStockValue(){return sum(db.cards,c=>Math.max(0,stockMain(c.id))*cCost(c))}function walletStockValue(){return sum(db.cards,c=>sum(db.wallets,w=>Math.max(0,stockWallet(w.id,c.id)))*cCost(c))}
function walletSalesRevenue(){return sum(db.walletSales,x=>x.amount)}function posRevenue(){return sum(db.deliveries.filter(x=>x.mode!=='consignment'),x=>x.amount)+sum(db.consignmentSettlements,x=>x.soldQty*x.unitPrice)}function operatingExpenses(){return sum(db.expenses,x=>x.amount)+sum(db.bills,x=>x.amount)}function soldCardCost(){return sum(db.deliveries.filter(x=>x.mode!=='consignment'),x=>num(x.qty)*cCost(card(x.cardId)))+sum(db.consignmentSettlements,x=>num(x.soldQty)*cCost(card(x.cardId)))+sum(db.walletSales,x=>num(x.qty)*cCost(card(x.cardId)))}function profitEstimate(){return posRevenue()+walletSalesRevenue()-soldCardCost()-operatingExpenses()}
function alerts(){let a=[];db.pos.forEach(p=>{let d=posDebt(p.id);if(d>0)a.push({type:'warn',text:`على نقطة البيع ${p.name} مبلغ مستحق ${money(d)}`})});db.cards.forEach(c=>{let threshold=num(c.alertAt);if(threshold>0&&stockMain(c.id)<=threshold)a.push({type:'warn',text:`مخزون ${c.name} منخفض: ${stockMain(c.id)} كرت`});if(stockMain(c.id)<0)a.push({type:'bad',text:`مخزون ${c.name} سالب؛ راجع الحركات`})});db.bills.filter(b=>!b.paid).forEach(b=>a.push({type:'warn',text:`التزام غير مسدد: ${b.name} — ${money(b.amount)}، موعد ${b.due||'غير محدد'}`}));if(cashBalance()<0)a.push({type:'bad',text:'رصيد الصندوق المحسوب سالب؛ راجع تسجيل العمليات والأرصدة الافتتاحية'});return a}

function simplePosStatementData(id){
 const deliveries=db.deliveries.filter(x=>x.posId===id).map(x=>({id:x.id,date:x.date,kind:x.mode==='cash'?'بيع نقدي':x.mode==='credit'?'بيع آجل':'تسليم كروت أمانة',card:cardLabel(x.cardId),cardId:x.cardId,qty:num(x.qty),price:num(x.unitPrice),amount:num(x.amount??(num(x.qty)*num(x.unitPrice))),method:x.mode==='cash'?'نقدًا':x.mode==='credit'?'آجل — لم يُسدّد عند التسليم':'أمانة — السداد عند البيع',note:x.mode==='consignment'?'لا يُضاف للدين إلا بعد تسجيل الكروت المباعة':(x.note||''),group:'delivery'}));
 const settles=[];
 db.consignmentSettlements.filter(x=>x.posId===id).forEach(x=>{
  if(num(x.soldQty)>0)settles.push({id:x.id,date:x.date,kind:'بيع كروت من الأمانة',card:cardLabel(x.cardId),cardId:x.cardId,qty:num(x.soldQty),price:num(x.unitPrice),amount:num(x.soldQty)*num(x.unitPrice),method:'مستحق بعد البيع',note:x.note||'تم تسجيل الكروت على أنها مباعة',group:'consignment-sale'});
  if(num(x.returnQty)>0)settles.push({id:x.id,date:x.date,kind:'إرجاع كروت أمانة',card:cardLabel(x.cardId),cardId:x.cardId,qty:num(x.returnQty),price:0,amount:0,method:'مرتجع للمخزون',note:x.note||'أعيد للمخزون',group:'consignment-return'});
 });
 const pays=db.payments.filter(x=>x.posId===id).map(x=>{
  const a=Array.isArray(x.allocations)?x.allocations[0]:null;
  const due=a?(a.sourceType==='delivery'?db.deliveries.find(d=>d.id===a.sourceId):db.consignmentSettlements.find(d=>d.id===a.sourceId)):null;
  return {id:x.id,date:x.date,kind:a?'تسديد دين سابق':'تسديد / تحصيل',card:a?cardLabel(due?.cardId):'—',cardId:due?.cardId||null,qty:null,price:null,amount:num(x.amount),method:x.method==='transfer'?'محفظة / تحويل':'نقدًا',note:x.note||(a?'سداد دين سابق':'تم استلام المبلغ'),group:'payment'};
 });
 const order={'delivery':0,'consignment-sale':1,'consignment-return':2,'payment':3};
 return deliveries.concat(settles,pays).sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))||(order[a.group]??4)-(order[b.group]??4));
}
function simpleOutstandingItems(id){
 const dues=[];
 db.deliveries.filter(x=>x.posId===id&&x.mode==='credit').forEach(x=>{let amount=Math.max(0,num(x.amount)-num(x.returnAmount));if(amount>0.009)dues.push({sourceType:'delivery',sourceId:x.id,date:x.date,card:cardLabel(x.cardId),cardId:x.cardId,qty:num(x.qty),price:num(x.unitPrice),amount,source:'بيع آجل',paidApplied:0,remaining:amount});});
 db.consignmentSettlements.filter(x=>x.posId===id&&num(x.soldQty)>0).forEach(x=>{let amount=num(x.soldQty)*num(x.unitPrice);if(amount>0.009)dues.push({sourceType:'consignment',sourceId:x.id,date:x.date,card:cardLabel(x.cardId),cardId:x.cardId,qty:num(x.soldQty),price:num(x.unitPrice),amount,source:'بيع من الأمانة',paidApplied:0,remaining:amount});});
 dues.sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')));
 for(const payment of db.payments.filter(x=>x.posId===id&&Array.isArray(x.allocations))){
  let budget=Math.max(0,num(payment.amount));
  for(const allocation of payment.allocations){
   if(budget<=0.009)break;
   const due=dues.find(d=>d.sourceType===allocation.sourceType&&String(d.sourceId)===String(allocation.sourceId));
   if(!due)continue;
   const applied=Math.min(budget,Math.max(0,num(allocation.amount)),due.remaining);
   due.remaining-=applied;due.paidApplied+=applied;budget-=applied;
  }
 }
 const unallocated=sum(db.payments.filter(x=>x.posId===id),x=>Math.max(0,num(x.amount)-sum(Array.isArray(x.allocations)?x.allocations:[],a=>a.amount)));
 let available=unallocated;
 for(const due of dues){const applied=Math.min(due.remaining,available);due.remaining-=applied;due.paidApplied+=applied;available-=applied;if(available<=0.009)break;}
 return dues.filter(x=>x.remaining>0.009);
}
function paySpecificDebt(sourceType,sourceId){
 const id=selectedPosId,p=pos(id);if(!p)return alert('افتح حساب نقطة البيع أولًا.');
 const due=simpleOutstandingItems(id).find(x=>x.sourceType===sourceType&&String(x.sourceId)===String(sourceId));
 if(!due)return alert('هذا الدين مسدد حسب السجل، أو لم يعد موجودًا. حدّث الكشف للمراجعة.');
 formModal('تسجيل سداد لهذا الدين',[field('تاريخ السداد','date','date',dateNow(),null,true),field('المبلغ الذي استلمته','amount','number',due.remaining,null,true),field('طريقة السداد','method','text','cash',[['cash','نقدًا'],['transfer','محفظة / تحويل']],true),textArea('ملاحظة','note','سداد دين سابق: '+due.card+' — تاريخ البيع '+due.date+' — الكمية '+due.qty+' — المتبقي '+money(due.remaining))],d=>{
  const amount=Number(d.amount);
  if(!validDateValue(d.date))return alert('أدخل تاريخ سداد صحيحًا.'),false;
  if(!Number.isFinite(amount)||amount<=0)return alert('أدخل مبلغًا أكبر من صفر.'),false;
  if(amount>due.remaining+0.009)return alert('المبلغ أكبر من المتبقي لهذا الدين ('+money(due.remaining)+').'),false;
  if(amount>Math.max(0,posDebt(id))+0.009)return alert('المبلغ أكبر من إجمالي الدين الحالي ('+money(Math.max(0,posDebt(id)))+').'),false;
  const label=due.card+' / تاريخ البيع '+due.date+' / كمية '+due.qty;
  db.payments.push({id:uid(),date:d.date,posId:id,amount,method:d.method,note:d.note||('سداد دين: '+label),allocations:[{sourceType,sourceId,amount}]});
  addAudit('تسجيل سداد دين محدد',p.name+' / '+label+' / '+money(amount)+' / '+(d.method==='transfer'?'محفظة':'نقدًا'));return persist();
 });
}

function editDelivery(id){
 const old=db.deliveries.find(x=>x.id===id);if(!old)return alert('لم نعثر على عملية التسليم هذه.');
 formModal('تعديل تسليم كروت — راجع الكمية والسعر قبل الحفظ',[
  field('تاريخ التسليم','date','date',old.date||dateNow(),null,true),field('فئة الكرت','cardId','text',old.cardId,optsCards(),true),field('عدد الكروت المسلّمة','qty','number',old.qty,null,true),field('نوع التسليم','mode','text',old.mode,[['cash','بيع نقدي'],['credit','بيع آجل'],['consignment','أمانة']],true),field('سعر الكرت الواحد','unitPrice','number',old.unitPrice,null,true),textArea('ملاحظات','note',old.note||'')
 ],d=>{
  const qty=Number(d.qty),price=Number(d.unitPrice),targetCard=card(d.cardId);

  if(!Number.isFinite(price)||price<0)return alert('سعر الكرت غير صحيح.'),false;
  const available=stockMain(d.cardId)+(d.cardId===old.cardId?num(old.qty):0);
  if(qty>available)return alert('الكمية المطلوبة أكبر من المخزون المتاح. المتاح للتعديل: '+available+' كرت.'),false;

    const totalConsignedAfter=sum(db.deliveries.filter(x=>x.id!==old.id&&x.posId===old.posId&&x.cardId===old.cardId&&x.mode==='consignment'),x=>x.qty)+qty;

   }
  }
  const newAmount=qty*price;
  if(!Number.isFinite(newAmount))return alert('إجمالي التسليم يتجاوز النطاق المالي المدعوم. راجع الكمية والسعر.'),false;
  if(num(old.returnAmount)>newAmount&&d.mode==='credit')return alert('لا يمكن جعل قيمة التسليم أقل من قيمة مرتجع مسجل مرتبط به.'),false;
  const allocated=sum(db.payments.filter(pay=>pay.posId===old.posId&&Array.isArray(pay.allocations)),pay=>sum(pay.allocations.filter(a=>a.sourceType==='delivery'&&String(a.sourceId)===String(old.id)),a=>a.amount));
  if(allocated>0.009&&(d.mode!=='credit'||newAmount-num(old.returnAmount)<allocated-0.009))return alert('توجد تحصيلات مرتبطة بهذه العملية بمبلغ '+money(allocated)+'. لا تغيّر نوعها أو تقلّل قيمتها عن المبلغ المرتبط بها.'),false;
  const oldContribution=old.mode==='credit'?Math.max(0,num(old.amount)-num(old.returnAmount)):0,newContribution=d.mode==='credit'?Math.max(0,newAmount-num(old.returnAmount)):0;
  if(posDebt(old.posId)-oldContribution+newContribution < -0.009)return alert('هذا التعديل سيجعل التحصيلات أكبر من الدين المسجل. راجع نوع التسليم أو مبلغ التحصيل.'),false;

 });

function backup(){

  const fileName='spider-net-backup-'+dateNow()+'.json';
  if(window.AndroidBackup&&typeof window.AndroidBackup.saveBackup==='function'){
   window.AndroidBackup.saveBackup(json,fileName); return;
  }
  const blob=new Blob([json],{type:'application/json;charset=utf-8'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download=fileName;a.style.display='none';document.body.appendChild(a);a.click();

function applyBackupText(text,fileName){

  const x=JSON.parse(text);

  if(!x||x.version!==1||!x.settings||typeof x.settings!=='object'||Array.isArray(x.settings)||!requiredArrays.every(k=>Array.isArray(x[k]))||(x.consignmentSettlements!==undefined&&!Array.isArray(x.consignmentSettlements)))throw Error('format');
  if(!Array.isArray(x.consignmentSettlements))x.consignmentSettlements=[];
  if(!confirm('ستُستبدل بيانات هذا الجهاز بالنسخة المختارة. تأكد من الاحتفاظ بنسخة من البيانات الحالية. هل تريد المتابعة؟'))return false;
  const wasBlocked=recoveryInfo.blocked;
  recoveryInfo.blocked=false; // An explicitly confirmed, structurally valid backup is the authorized recovery path.
  db=x;
  addAudit('استعادة نسخة احتياطية',fileName||'نسخة JSON');
  if(!persist()){
   db=previous;
   recoveryInfo.blocked=wasBlocked;
   return false;
  }
 }catch(err){
  db=previous;
  alert('تعذرت استعادة النسخة أو حفظها. لم تُعتمد بيانات النسخة المختارة. تحقق من سلامة الملف ومساحة التخزين.');
  return false;
 }
 try{
  render();
 }catch(renderError){
  alert('حُفظت النسخة الاحتياطية، لكن تعذر تحديث الواجهة. أعد فتح التطبيق للتحقق من البيانات.');

}
